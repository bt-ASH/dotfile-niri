name = "matugen"
description = "matugen 同步主题（与 kitty 配色适配）"

[dark]
# 主色 -> kitty color8/color12 (primary)
primary = "#c7bfff" # Matugen Generated
# 次色 -> kitty color14 (secondary)
secondary = "#c8c3dc"
# 强调色 -> kitty color5 (tertiary)
accent = "#ecb8cf"
# 成功色
success = "#ecb8cf"
# 警告色
warning = "#ecb8cf"
# 错误色 -> matugen error
error = "#ffb4ab"
# 信息色
info = "#c7bfff"
# 弱化文字
muted = "#928f99"
# 快捷键提示
hintKey = "#928f99"
# 背景色 -> kitty background (surface)
background = "#141318"
# 前景色 -> kitty foreground (on_surface)
foreground = "#e5e1e9"
# 边框色
border = "#928f99"
# 表面色（卡片/浮层背景）
surface = "#141318"
# 菜单选中分隔符
menuSelectedSepLeft = " "
menuSelectedSepRight = " "

[dark.highlights]
# 菜单标题
menuTitle = "#c7bfff"
# 菜单项文字
menuItem = "#e5e1e9"
# 鼠标悬停
menuItemHover = "#c7bfff"
# 方向键选中
selectedItem = "#c7bfff"
# 选中+悬停
selectedItemHover = "#c7bfff"
# 选中项背景
selectedItemBg = "transparent"

[dark.popup]
surface = "#141318"
border = "#928f99"

[dark.notification]
surface = "#141318"
infoBorder = "#c7bfff"
successBorder = "#c7bfff"
warningBorder = "#ecb8cf"
errorBorder = "#ffb4ab"

[dark.statusBar]
nuggetLabelFg = "#c7bfff"
nuggetLabelBg = "transparent"
timeSepLeft = " "
breadcrumbSepRight = " "
breadcrumbHover = "#c7bfff"

[dark.markdown]
dark = "dark"
light = "light"

[dark.app]
# 歌词配色
lyricActive = "#e5e1e9"
lyricTransition = "#c8c3dc"
lyricInactive = "#928f99"
lyricHighlight = "#c7bfff"
# 播放栏
playbarMode = "#ecb8cf"
playbarVolume = "#c7bfff"
playbarPlaying = "#c7bfff"
playbarPaused = "#c8c3dc"
playbarHeartLiked = "#c7bfff"
playbarHeartUnliked = "#928f99"
playbarArtist = "#928f99"
# 频谱
visualizerColorStart = "#c7bfff"
visualizerColorEnd = "#ecb8cf"
# 背景类
background = "transparent"
contextMenuBg = "transparent"
spectrumVerticalBg = "transparent"
desktopLyricsBg = "transparent"
configTableSelectedBg = "transparent"
